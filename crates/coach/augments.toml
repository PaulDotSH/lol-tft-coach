# ARAM: Mayhem augment tags for item scoring and picked-augment detection (patch 26.21).
# id = u.gg / CommunityDragon AugmentPlatformId (game/maps/modespecificdata/kiwi.bin.json);
# text: CommunityDragon game/en_us/data/menu/en_us/lol.stringtable.json. Tags were
# keyword-parsed from those descriptions (On-Hit, Critical Strike, Attack Speed, Ability
# Haste, Ability Power, Heal and Shield Power, Health/Armor/Magic Resist, Mana, Attack Range,
# Tenacity, Move Speed, QUEST … REWARD item), then checked by hand against
# wiki.leagueoflegends.com/en-us/Module:MayhemAugmentData/data. Re-check every patch.
#
# tags: on_hit crit attack_speed haste ap heal_shield tank mana range tenacity move_speed quest_item
# stats: instant gain on pick in championStats units (fractions for %), used to tell which
#   offered augment was taken. `*_pct` multiply the value before the pick (as_pct: × base
#   attack speed). Scaling tooltips use their lower bound (≥).
# grants: item given on pick. requires: quest items (raised in scoring).
# favors: items known to pair best with it (player experience), raised in scoring.
# keep_slot: the quest reward is an extra item that needs a free slot.

# Heal and Shield Power items (Data Dragon has no stat for it).
