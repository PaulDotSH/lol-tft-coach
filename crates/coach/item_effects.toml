# Item passives that change damage or effective HP and that Data Dragon stats miss (patch 16.21). Items not
# listed count by their stats only. Check each patch together with modes.toml. Numbers Data Dragon prints in the
# description are taken from it; the rest (blank in Data Dragon) are the wiki's values, unchecked in game.
#
# Stat effects (in my live stats once owned, so they count for the item being bought only):
#   ap_mult, ap, hp, mr, crit, base_ad_bonus (share of base AD as bonus AD), ad_per_bonus_hp, ap_per_bonus_hp.
# Damage effects (count for every item held): crit_damage, amp (all damage), amp_magic, amp_in_combat (full in the
#   sustained output, half in burst), amp_vs_hp (up to this at 1500 target bonus HP), on_hit_flat / on_hit_ap /
#   on_hit_hp (my max HP) / on_hit_current_hp (target), burn_max_hp (target, whole burn) over burn_s,
#   proc_flat / proc_ap / proc_base_ad / proc_bonus_ad / proc_hp every proc_cd seconds, shred_armor / shred_mr
#   (target resist share at full stacks), basic_haste, ult_haste, melee_scale (melee users), kind of the
#   on-hit / proc damage (physical, magic, true).
# Defensive (item being bought): shield, ehp_mult_physical, ehp_mult_magic.

