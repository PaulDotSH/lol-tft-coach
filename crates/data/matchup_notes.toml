# Hand-written notes for one exact pairing: [my champion] then their champion = one line, or a
# list of tips with the main one first (each at most 180 characters). A tip that only holds with
# one keystone is written { keystone = "Grasp of the Undying", tip = "..." }: champ select shows
# it under the keystone's name, the game only when that is my keystone. Keyed by Data Dragon id.
# Champion-wide notes live in champ_notes.toml. A pair without a line here still gets the lines
# `coach` writes from both kits (kits.toml) and from the lolalytics matchup page.

