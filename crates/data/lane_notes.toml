# Hand-written bot lane notes, keyed by Data Dragon id (static knowledge, no live data).
# Tags (all optional, default false):
#   level2  strong level-2 all-in       level6  the ult turns the lane at 6
#   engage  hard engage                 poke    wins by poking
#   sustain heals or shields through poke
# note: one short line on how to play against them (at most 80 characters).

