# Hand-written kit tags, one line per champion, keyed by Data Dragon id: tag = the spell that
# does it ("Q", "W", "E", "R" or "P" for the passive). `coach` pairs my tags with the lane
# opponent's to write the lines that are about both kits. A champion left out, or a tag left
# off, only means fewer lines. Melee or ranged, damage type and tankiness come from Data Dragon
# and traits.toml; level 2 and level 6 from champ_notes.toml.
#   poke        ranged harass                   autos       fights with basic attacks
#   burst       all-in combo                    shield      shield or damage reduction
#   sustain     heals without hitting a champion  armor_stack gains armour (and no magic resist)
#   spell_shield blocks a spell or its CC       dodge       untargetable, parry or stasis
#   auto_block  blocks or blinds basic attacks  proj_block  stops projectiles
#   as_slow     cuts attack speed               hook        pull or leash that minions block
#   bind        hard CC thrown as a projectile  point_cc    targeted hard CC
#   zone_cc     hard CC placed on the ground
#   engage      gap-closing hard engage         dash        dash or leap
#   blink       instant move                    anti_dash   stops or interrupts dashes
#   true_dmg    true damage                     pct_hp      damage by the target's health

