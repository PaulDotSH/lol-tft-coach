[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
model = { path = "crates/model" }
model-core = { path = "crates/model-core" }
model-static = { path = "crates/model-static" }
model-game = { path = "crates/model-game" }
model-live = { path = "crates/model-live" }
model-draft = { path = "crates/model-draft" }
model-review = { path = "crates/model-review" }
data = { path = "crates/data" }
clients = { path = "crates/clients" }
coach = { path = "crates/coach" }
ocr = { path = "crates/ocr" }
tft-model = { path = "crates/tft-model" }
tft-data = { path = "crates/tft-data" }
tft-coach = { path = "crates/tft-coach" }
tft-vision = { path = "crates/tft-vision" }
tft-choncc = { path = "crates/tft-choncc" }
tft-embed = { path = "crates/tft-embed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
ts-rs = "12"
strsim = "0.11"
toml = "1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
half = "2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
