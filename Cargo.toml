[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.0"

[workspace.dependencies]
model = { path = "crates/model" }
data = { path = "crates/data" }
clients = { path = "crates/clients" }
coach = { path = "crates/coach" }
ocr = { path = "crates/ocr" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "gzip"] }
ts-rs = "12"
strsim = "0.11"
toml = "1"
dirs = "7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
