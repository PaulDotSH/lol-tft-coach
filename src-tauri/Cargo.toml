[package]
name = "lol-coach"
edition.workspace = true
version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
model.workspace = true
data.workspace = true
clients.workspace = true
coach.workspace = true
ocr.workspace = true
tft-model.workspace = true
tft-data.workspace = true
tft-coach.workspace = true
tft-choncc.workspace = true
tft-vision.workspace = true
tft-embed.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio.workspace = true
reqwest.workspace = true
toml.workspace = true
dirs.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
png = "0.18"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
